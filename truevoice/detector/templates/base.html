<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TrueVoice AI</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        html, body {
            height: 100%;
            margin: 0;
            background: url("/static/images/background.png") no-repeat top center;
            background-size: 100% auto;
            background-color: #010409;
        }

        body {
            color: #ffffff;
            overflow-x: hidden;
        }

        .highlight { color: #00ff88; }

        /* ================= NAVBAR ================= */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            width: 90%;
            margin: 15px auto;
            padding: 12px 25px;

            background: rgba(10, 15, 25, 0.6);
            backdrop-filter: blur(20px);

            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.08);

            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        header::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 20px;
            padding: 1px;
            background: linear-gradient(90deg, transparent, #00ff88, transparent);
            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo svg {
            filter: drop-shadow(0 0 8px #00ff88);
        }

        nav {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        nav a {
            color: #e4dede;
            text-decoration: none;
            font-size: 14px;
        }

        nav a:hover {
            color: #00ff88;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .lang-dropdown select {
            padding: 6px 10px;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
        }

        .theme-toggle {
            padding: 6px 10px;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid #00ff88;
        }

        /* ================= FOOTER ================= */
        .footer {
            margin-top: 80px;
            padding: 50px 8%;
            background: transparent;
            backdrop-filter: blur(15px);
            position: relative;
        }

        .footer::before {
            content: "";
            position: absolute;
            top: 0;
            left: 10%;
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00ff88, transparent);
            box-shadow: 0 0 10px rgba(0,255,136,0.6);
        }

        .footer-container {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 40px;
        }

        .footer-col {
            min-width: 200px;
        }

        .footer-col h4 {
            margin-bottom: 15px;
        }

        .footer-col a {
            display: block;
            color: #8b949e;
            text-decoration: none;
            margin-bottom: 10px;
        }

        .footer-col a:hover {
            color: #00ff88;
        }

        .footer-col p {
            color: #8b949e;
        }

        .footer .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .footer .logo svg {
            filter: drop-shadow(0 0 6px #00ff88);
        }

        .footer-col.right {
            text-align: right;
        }

        .socials {
            margin-top: 15px;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .socials i {
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            cursor: pointer;
        }

        .socials i:hover {
            background: #00ff88;
            color: black;
        }

/* MODAL BACKGROUND */
.settings-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    z-index: 2000;

    justify-content: center;
    align-items: center;
}

/* BOX */
.settings-box {
    width: 500px;
    background: rgba(20,25,35,0.9);
    backdrop-filter: blur(20px);

    border-radius: 15px;
    padding: 20px;
    color: white;

    border: 1px solid rgba(255,255,255,0.1);
}

/* HEADER */
.settings-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.settings-header span {
    cursor: pointer;
    font-size: 22px;
}

/* ROW */
.setting-row {
    margin: 20px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* BUTTONS */
.options button {
    margin-right: 10px;
    padding: 6px 12px;
    border-radius: 8px;
    border: none;
    background: #1f2937;
    color: white;
    cursor: pointer;
}

.options .active {
    background: #2563eb;
}

/* COLORS */
.color-options span {
    display: inline-block;
    width: 25px;
    height: 25px;
    border-radius: 50%;
    margin-right: 8px;
    cursor: pointer;
}

/* FOOTER */
.settings-footer {
    display: flex;
    justify-content: flex-end;
    margin-top: 20px;
}

.settings-footer button {
    padding: 8px 15px;
    margin-left: 10px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
}

.cancel {
    background: gray;
}

.apply {
    background: #2563eb;
    color: white;
}


/*  Modal */


:root {
    --bg-color: #010409;
    --text-color: #ffffff;
    --card-bg: rgba(255,255,255,0.05);
    --accent: #00ff88;
    --font-size: 16px;
}

/* APPLY EVERYWHERE */
body {
    background: var(--bg-color);
    color: var(--text-color);
    font-size: var(--font-size);
}

/* LIGHT MODE */
.light-mode {
    --bg-color: #ffffff;
    --text-color: #000000;
    --card-bg: rgba(0,0,0,0.05);
}

/* APPLY COLOR */
.highlight,
.btn-main,
nav a:hover {
    color: var(--accent);
}

/* BUTTON EXAMPLE */
.btn-main {
    border: 1px solid var(--accent);
}

/* CARDS */
.upload-box,
.waveform-card,
.settings-box {
    background: var(--card-bg);
}

/* BACKGROUND IMAGE (KEEP SAME) */
body {
    background: url("/static/images/background.png") no-repeat top center;
    background-size: 100% auto;
}

/* OVERLAY BASE */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
}

/* LIGHT MODE EFFECT */
.light-mode::before {
    background: rgba(255,255,255,0.5); /* adjust 0.4–0.6 */
}
    </style>
</head>

<body>

<!-- ================= NAVBAR ================= -->
<header>

    <div class="logo">
        <svg width="40" height="25" viewBox="0 0 40 25">
            <rect x="2" y="10" width="3" height="6"/>
            <rect x="7" y="7" width="3" height="10"/>
            <rect x="12" y="5" width="3" height="14"/>
            <rect x="17" y="2" width="3" height="20"/>
            <rect x="22" y="5" width="3" height="14"/>
            <rect x="27" y="7" width="3" height="10"/>
            <rect x="32" y="10" width="3" height="6"/>
        </svg>

        TrueVoice <span class="highlight">AI</span>
    </div>

    <nav>
        <a href="/"><i class="fas fa-home"></i> Home</a>
        <a href="/english"><i class="fas fa-headphones"></i> Check Audio</a>
        <a href="/login"><i class="fas fa-sign-in-alt"></i> Login</a>
        <a href="/signup"><i class="fas fa-user-plus"></i> Signup</a>

        <div class="nav-controls">
            <div class="lang-dropdown">
                <select onchange="changeLang(this.value)">
                    <option value="english">English</option>
                    <option value="marathi">Marathi</option>
                    <option value="hindi">Hindi</option>
                </select>
            </div>

            <div class="theme-toggle" onclick="openSettings()">
              <i class="fas fa-moon"></i>
            </div>
            
        </div>
    </nav>

</header>

<!-- ================= CONTENT BLOCK ================= -->
{% block content %}{% endblock %}

<!-- ================= FOOTER ================= -->
<footer class="footer">

    <div class="footer-container">

        <div class="footer-col">
            <div class="logo">
                TrueVoice <span class="highlight">AI</span>
            </div>
            <p>AI-powered deepfake audio detection system.</p>
        </div>

        <div class="footer-col">
            <h4>Links</h4>
            <a href="/">Home</a>
            <a href="/english">Check Audio</a>
        </div>

        <div class="footer-col right">
            <p>© 2026 TrueVoice AI</p>
        </div>

    </div>

</footer>

<script>
function changeLang(lang) {
    if (lang === "english") window.location.href = "/english";
    if (lang === "marathi") window.location.href = "/marathi";
    if (lang === "hindi") window.location.href = "/hindi";
}
</script>
<!-- SETTINGS MODAL -->
<div id="settingsModal" class="settings-modal">

    <div class="settings-box">

        <div class="settings-header">
            <h2>Settings</h2>
            <span onclick="closeSettings()">&times;</span>
        </div>

        <hr>

        <!-- MODE -->
        <div class="setting-row">
            <label>Mode</label>
            <div class="options">
                <button onclick="setMode('light')">☀ Light</button>
                <button onclick="setMode('dark')">🌙 Dark</button>
                <button onclick="setMode('auto')">⚪ Auto</button>
            </div>
        </div>

        <!-- THEME -->
        <div class="setting-row">
            <label>Theme</label>
            <div class="color-options">
                <span style="background:#00ff88" onclick="setTheme('#00ff88')"></span>
                <span style="background:#3b82f6" onclick="setTheme('#3b82f6')"></span>
                <span style="background:#ef4444" onclick="setTheme('#ef4444')"></span>
                <span style="background:#a855f7" onclick="setTheme('#a855f7')"></span>
            </div>
        </div>

        <!-- FONT -->
        <div class="setting-row">
            <label>Font Size</label>
            <div class="options">
                <button onclick="changeFont(2)">A+</button>
                <button onclick="changeFont(-2)">A-</button>
                <button onclick="resetFont()">Default</button>
            </div>
        </div>

        <!-- FOOTER BUTTONS -->
        <div class="settings-footer">
            <button class="cancel" onclick="closeSettings()">Cancel</button>
            <button class="apply">Apply</button>
        </div>

    </div>
</div>
<script>
function openSettings() {
    document.getElementById("settingsModal").style.display = "flex";
}

function closeSettings() {
    document.getElementById("settingsModal").style.display = "none";
}
</script>

<script>

// LOAD SAVED SETTINGS
window.onload = function () {
    const mode = localStorage.getItem("mode");
    const theme = localStorage.getItem("theme");
    const font = localStorage.getItem("font");

    if (mode) applyMode(mode);
    if (theme) applyTheme(theme);
    if (font) applyFont(font);
};

// MODE
function setMode(mode) {
    localStorage.setItem("mode", mode);
    applyMode(mode);
}

function applyMode(mode) {
    if (mode === "light") {
        document.body.classList.add("light-mode");
    } else if (mode === "dark") {
        document.body.classList.remove("light-mode");
    } else if (mode === "auto") {
        let isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (!isDark) {
            document.body.classList.add("light-mode");
        } else {
            document.body.classList.remove("light-mode");
        }
    }
}

// THEME COLOR
function setTheme(color) {
    localStorage.setItem("theme", color);
    applyTheme(color);
}

function applyTheme(color) {
    document.documentElement.style.setProperty("--accent", color);
}

// FONT SIZE
function changeFont(change) {
    let current = parseInt(getComputedStyle(document.body).fontSize);
    let newSize = current + change;

    localStorage.setItem("font", newSize);
    applyFont(newSize);
}

function resetFont() {
    localStorage.setItem("font", 16);
    applyFont(16);
}

function applyFont(size) {
    document.documentElement.style.setProperty("--font-size", size + "px");
}

</script>
</body>
</html>
