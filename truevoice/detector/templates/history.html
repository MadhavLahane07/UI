<!DOCTYPE html>
<html>
<head>
    <title>History</title>
</head>
<body style="background:#0f172a; color:white; text-align:center;">

    <h1>📊 Prediction History</h1>

    <table border="1" style="margin:auto; color:white;">
        <tr>
            <th>Result</th>
            <th>Confidence</th>
            <th>Date</th>
        </tr>

        {% for item in data %}
        <tr>
            <td>{{ item.result }}</td>
            <td>{{ item.confidence }}%</td>
            <td>{{ item.created_at }}</td>
        </tr>
        {% endfor %}
    </table>

    <br>
    <a href="/">⬅ Back</a>

</body>
</html>
