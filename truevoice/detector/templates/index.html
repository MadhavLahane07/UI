<!DOCTYPE html>
<html>
<head>
    <title>{{ text.title }}</title>

    <style>
        body.light { background: #ffffff; color: #000; }
        body.dark { background: #0f172a; color: #fff; }

        .navbar {
            background: #1e293b;
            padding: 15px;
            display: flex;
            justify-content: space-between;
        }

        a { color: #22C55E; margin: 5px; text-decoration: none; }

        button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            background: #4F46E5;
            color: white;
            cursor: pointer;
        }

        .container { text-align: center; padding: 50px; }
    </style>
</head>

<body>

<div class="navbar">
    <div><b>🎤 {{ text.title }}</b></div>

    <div>
        🌍 
        <a href="/?lang=en">English</a> |
        <a href="/?lang=hi">हिंदी</a> |
        <a href="/?lang=mr">मराठी</a>
    </div>

    <div>
        <a href="/history/">{{ text.history }}</a> |
        <a href="/logout/">{{ text.logout }}</a> |
        <button onclick="toggleMode()">🌙</button>
    </div>
</div>

<div class="container">
    <h1>{{ text.title }}</h1>

    <form action="{% url 'predict' %}" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="hidden" name="lang" value="{{ lang }}">
        <input type="file" name="audio" required>
        <br><br>
        <button type="submit">{{ text.detect }}</button>
    </form>
</div>

<script>
function toggleMode() {
    let body = document.body;
    if (body.classList.contains("dark")) {
        body.classList.remove("dark");
        body.classList.add("light");
        localStorage.setItem("theme", "light");
    } else {
        body.classList.remove("light");
        body.classList.add("dark");
        localStorage.setItem("theme", "dark");
    }
}

window.onload = function () {
    let theme = localStorage.getItem("theme");
    if (theme === "light") {
        document.body.classList.add("light");
    } else {
        document.body.classList.add("dark");
    }
}
</script>

</body>
</html>
