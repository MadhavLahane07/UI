<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TrueVoice AI | Login</title>

 <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

/* BACKGROUND */
body {
    height: 100vh;
    background: radial-gradient(circle at top, #0f172a, #020617);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* SOFT GLOW EFFECT */
body::before {
    content: '';
    position: absolute;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, #22c55e, transparent);
    filter: blur(140px);
    top: 20%;
    left: 30%;
    opacity: 0.6;
}

/* CARD (BIGGER) */
.container {
    width: 430px;              /* increased */
    padding: 45px;             /* increased */
    border-radius: 22px;

    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);

    border: 1px solid rgba(255,255,255,0.08);

    box-shadow:
        0 30px 70px rgba(0,0,0,0.7),
        inset 0 1px 0 rgba(255,255,255,0.1);

    text-align: center;
    position: relative;
}

/* TOP LIGHT EFFECT */
.container::before {
    content: '';
    position: absolute;
    top: -2px;
    left: 20%;
    width: 60%;
    height: 3px;
    background: linear-gradient(90deg, transparent, #22c55e, transparent);
    border-radius: 50%;
}

/* TITLE */
.logo {
    font-size: 24px;   /* increased */
    font-weight: 600;
    color: #fff;
    margin-bottom: 15px;
}

.logo span {
    color: #22c55e;
}

h2 {
    color: #fff;
    margin-bottom: 30px;
    font-size: 24px;   /* increased */
}

/* INPUT */
.input-box {
    position: relative;
    margin: 20px 0;
}

.input-box input {
    width: 100%;
    padding: 15px;          /* increased */
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.03);
    color: white;
    font-size: 15px;        /* increased */
    outline: none;
    transition: 0.3s;
}

/* INPUT FOCUS */
.input-box input:focus {
    border: 1px solid #22c55e;
    box-shadow: 0 0 12px rgba(34,197,94,0.5);
}

/* BUTTON */
.btn {
    width: 100%;
    padding: 15px;          /* increased */
    margin-top: 25px;
    border-radius: 14px;
    border: none;

    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: white;

    font-size: 16px;        /* increased */
    cursor: pointer;
    transition: 0.3s;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(34,197,94,0.5);
}

/* ERROR */
.error {
    color: #ef4444;
    margin-bottom: 12px;
    font-size: 14px;
}

/* EXTRA */
.extra {
    margin-top: 20px;
    font-size: 14px;
    color: #aaa;
}

.extra a {
    color: #22c55e;
    text-decoration: none;
}
</style>
</head>
<body>

    <div class="container">

        <div class="logo">TrueVoice <span>AI</span></div>

        <h2>Login to Account</h2>

        {% if messages %}
            {% for message in messages %}
                <p class="error">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="input-box">
                <input type="text" name="username" placeholder="Enter your Username" required>
            </div>

            <div class="input-box">
                <input type="password" name="password" placeholder="Password" required>
            </div>

            <button type="submit" class="btn">Login</button>

            <div class="extra">
                Don't have an account? <a href="/signup">Sign Up</a>
            </div>

        </form>

    </div>

</body>
</html>
