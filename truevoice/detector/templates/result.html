{% extends "base.html" %}

{% block content %}

<style>
    .result-page {
        padding: 180px 8% 100px;
        text-align: center;
    }

    .result-card {
        margin: auto;
        padding: 40px;
        width: 400px;
        border-radius: 20px;

        background: rgba(255,255,255,0.05);
        backdrop-filter: blur(15px);

        border: 1px solid rgba(255,255,255,0.1);

        box-shadow:
            0 0 20px rgba(0,255,136,0.2),
            inset 0 0 10px rgba(255,255,255,0.05);
    }

    .result-text {
        font-size: 28px;
        font-weight: 700;
        margin: 20px 0;
    }

    .real { color: #22C55E; }
    .fake { color: #EF4444; }

    .confidence {
        font-size: 18px;
        color: #8b949e;
    }

    .back-btn {
        margin-top: 30px;
        display: inline-block;
        padding: 12px 20px;
        border-radius: 10px;
        background: #4F46E5;
        color: white;
        text-decoration: none;
        transition: 0.3s;
    }

    .back-btn:hover {
        background: #3730a3;
    }
</style>

<section class="result-page">

    <div class="result-card">

        <h2>{{ text.result }}</h2>


         <div class="result-text {% if result_type == 'real' %}real{% else %}fake{% endif %}">
            {{ result }}
         </div>

        <div class="confidence">
            {{ text.confidence }}: {{ confidence }}%
        </div>

       
        <a href="
{% if lang == 'en' %}
    {% url 'english' %}
{% elif lang == 'mr' %}
    {% url 'marathi' %}
{% else %}
    {% url 'hindi' %}
{% endif %}
" class="back-btn">
⬅ {{ text.back }}
</a>

    </div>

</section>

{% endblock %}
