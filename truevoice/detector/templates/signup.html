<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TrueVoice AI | Sign Up</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

/* BACKGROUND */
body {
    height: 100vh;
    background: radial-gradient(circle at top, #0f172a, #020617);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* GLOW */
body::before {
    content: '';
    position: absolute;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, #22c55e, transparent);
    filter: blur(140px);
    top: 20%;
    left: 30%;
    opacity: 0.6;
}

/* CARD */
.container {
    width: 430px;
    padding: 45px;
    border-radius: 22px;

    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);

    border: 1px solid rgba(255,255,255,0.08);

    box-shadow:
        0 30px 70px rgba(0,0,0,0.7),
        inset 0 1px 0 rgba(255,255,255,0.1);

    text-align: center;
    position: relative;
}

/* TOP LIGHT */
.container::before {
    content: '';
    position: absolute;
    top: -2px;
    left: 20%;
    width: 60%;
    height: 3px;
    background: linear-gradient(90deg, transparent, #22c55e, transparent);
    border-radius: 50%;
}

/* TITLE */
.logo {
    font-size: 24px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 15px;
}

.logo span {
    color: #22c55e;
}

h2 {
    color: #fff;
    margin-bottom: 25px;
    font-size: 24px;
}

/* INPUT */
.input-box {
    margin: 18px 0;
}

.input-box input {
    width: 100%;
    padding: 15px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.03);
    color: white;
    font-size: 15px;
    outline: none;
    transition: 0.3s;
}

.input-box input:focus {
    border: 1px solid #22c55e;
    box-shadow: 0 0 12px rgba(34,197,94,0.5);
}

/* BUTTON */
.btn {
    width: 100%;
    padding: 15px;
    margin-top: 20px;
    border-radius: 14px;
    border: none;

    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: white;

    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(34,197,94,0.5);
}

/* ERROR */
.error {
    color: #ef4444;
    margin-bottom: 10px;
    font-size: 14px;
}

/* EXTRA */
.extra {
    margin-top: 18px;
    font-size: 14px;
    color: #aaa;
}

.extra a {
    color: #22c55e;
    text-decoration: none;
}
.logo a,
.logo-link{
    text-decoration: none;
    color: white;
}

.logo-link span{
    color: #22c55e;
}

.logo-link:hover{
    opacity: 0.9;
}
</style>
</head>

<body>

<div class="container">

    
        <div class="logo">
    <a href="{% url 'home' %}" class="logo-link">
        TrueVoice <span>AI</span>
    </a>
</div>

    <h2>Create Account</h2>

    <!-- Messages -->
    {% if messages %}
        {% for message in messages %}
            <p class="error">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="input-box">
            <input type="text" name="username" placeholder="Username" required>
        </div>

        <div class="input-box">
            <input type="email" name="email" placeholder="Email" required>
        </div>

        <div class="input-box">
            <input type="password" id="password" name="password" placeholder="Password" required>
        </div>


        <div class="input-box">
           <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required>
        </div>
        <div id="password-error" class="error" style="display:none;"></div>

        <button type="submit" class="btn">Sign Up</button>

        <div class="extra">
            Already have an account? <a href="/login">Login</a>
        </div>

    </form>

</div>


<script>
let confirmInput = document.getElementById("confirm_password");
let passwordInput = document.getElementById("password");
let errorBox = document.getElementById("password-error");

confirmInput.addEventListener("keyup", function() {
    if (passwordInput.value !== confirmInput.value) {
        errorBox.style.display = "block";
        errorBox.innerText = "❌ Passwords do not match!";
    } else {
        errorBox.style.display = "none";
    }
});
</script>

</body>
</html>
